name: Auto-Generate-Sitemap
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build_sitemap_job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test python env & create simple sitemap
        run: |
          python3 --version
          ls -la
          cat > test.py <<'EOF'
import os
print("scan files...")
all_md=[]
for root,dirs,files in os.walk("."):
    for fn in files:
        if fn.endswith(".md"):
            all_md.append(os.path.join(root,fn))
print("Total md count:", len(all_md))

# write minimal sitemap_index.xml
xml = '''<?xml version="1.0" encoding="UTF-8"?>
<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
</sitemapindex>
'''
with open("sitemap_index.xml","w",encoding="utf-8") as f:
    f.write(xml)
EOF
          python3 test.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-output
          path: sitemap_index.xml
