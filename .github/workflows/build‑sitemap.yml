name: Auto Generate Blob‑URL Sitemap
on:
  schedule:
    - cron: '0 2 * * *'  # UTC 02点=北京时间10点，每日定时
  workflow_dispatch:

jobs:
  build_sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main   # 强制检出main分支，避免detached HEAD推送失败

      - name: Generate sitemap_index + split sitemap(github blob url)
        run: |
          python3 - << 'PYTHON'
import os
import math
from datetime import datetime
import urllib.parse

BLOB_BASE = "https://github.com/yaozhongpeng/wuliu/blob/main/"
MAX_URL_PER_SITEMAP = 3000
EXCLUDE_FILES = {"README.md"}
OUTPUT_INDEX = "sitemap_index.xml"

md_url_list = []
for root, dirs, files in os.walk("."):
    for filename in files:
        if not filename.lower().endswith(".md"):
            continue
        if filename in EXCLUDE_FILES:
            continue
        fullpath = os.path.join(root, filename)
        rel_path = fullpath[2:]
        encoded_rel = urllib.parse.quote(rel_path)
        page_url = BLOB_BASE + encoded_rel
        mtime = datetime.fromtimestamp(os.path.getmtime(fullpath)).strftime("%Y-%m-%d")
        md_url_list.append({"loc": page_url, "lastmod": mtime})

total = len(md_url_list)
print(f"Total md files: {total}")
chunk_count = math.ceil(total / MAX_URL_PER_SITEMAP) if total>0 else 0
sub_sitemap_files = []

for chunk_idx in range(chunk_count):
    start = chunk_idx * MAX_URL_PER_SITEMAP
    end = start + MAX_URL_PER_SITEMAP
    chunk_data = md_url_list[start:end]
    sitemap_filename = f"sitemap_{chunk_idx+1:02d}.xml"
    sub_sitemap_files.append(sitemap_filename)
    xml_header = '''<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
'''
    xml_body = ""
    for item in chunk_data:
        xml_body += f'''  <url>
    <loc>{item["loc"]}</loc>
    <lastmod>{item["lastmod"]}</lastmod>
    <changefreq>weekly</changefreq>
    <priority>0.7</priority>
  </url>
'''
    xml_footer = "\n</urlset>"
    out_content = xml_header + xml_body + xml_footer
    with open(sitemap_filename,"w",encoding="utf-8") as f:
        f.write(out_content)
    print(f"Generated {sitemap_filename}, count:{len(chunk_data)}")

index_header = '''<?xml version="1.0" encoding="UTF-8"?>
<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
'''
index_body = ""
for sub_file in sub_sitemap_files:
    encoded_sub = urllib.parse.quote(sub_file)
    sub_url = BLOB_BASE + encoded_sub
    index_body += f'''  <sitemap>
    <loc>{sub_url}</loc>
    <lastmod>{datetime.now().strftime("%Y-%m-%d")}</lastmod>
  </sitemap>
'''
index_footer = "\n</sitemapindex>"
index_content = index_header + index_body + index_footer
with open(OUTPUT_INDEX,"w",encoding="utf-8") as f:
    f.write(index_content)
print(f"Generated {OUTPUT_INDEX}, sub‑sitemap:{len(sub_sitemap_files)}")
PYTHON

      - name: Commit sitemap files into repo root
        run: |
          git config --global user.name "github-action-robot"
          git config --global user.email "action@github.com"
          git add sitemap_index.xml sitemap_*.xml
          # 没有变更直接退出；有变更就提交推送，commit消息带[skip ci]防止触发workflow
          if ! git diff --cached --exit-code; then
            git commit -m "ci: update blob‑url sitemap [skip ci]"
            git push origin main
          fi
